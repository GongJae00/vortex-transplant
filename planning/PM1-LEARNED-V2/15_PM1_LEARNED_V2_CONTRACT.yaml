    channels:
      primary:
        value: 8
        status: FROZEN_ENGINEERING
        rationale: "V1 default; provides sufficient expressivity for copy task while keeping compute tractable."
        sensitivity_analysis: >
          Changing channel count would alter the multichannel topology landscape.
          The C=1 comparison isolates the channel-dependence question without
          needing to vary this parameter.
      scalar_gateway:
        status: UNFROZEN_CALIBRATION
        candidate_values: [1]
        calibration_method: "C05–C06 C=1 micro-pilot"
        freeze_condition: "C=1 achieves ≥ 90% validation accuracy on copy task"
    height:
      value: 16
      status: FROZEN_ENGINEERING
      rationale: "V1 default; 16×16 torus is the smallest lattice that supports nontrivial vortex configurations."
      sensitivity_analysis: "Larger lattices increase vortex density; the 16×16 choice reflects the PI's hardware constraint."
    width:
      value: 16
      status: FROZEN_ENGINEERING
      rationale: "Symmetric torus; see height rationale."
      sensitivity_analysis: "Identical to height sensitivity."
    kernel_size:
      value: 3
      status: FROZEN_ENGINEERING
      rationale: "Standard 3×3 convolution; sufficient receptive field for local phase dynamics."
      sensitivity_analysis: "Larger kernels may alter spatial coupling; fixed for V2."
    vocabulary:
      value: 10
      status: FROZEN_ENGINEERING
      rationale: "Copy-task vocabulary size; V1 default."
      sensitivity_analysis: "Vocabulary size affects embedding dimensionality; fixed for V2."

  plain:
    type:
      value: "PlainConvRNN"
      status: FROZEN_ENGINEERING
      rationale: "Control model: same architecture without U(1) equivariance."
      sensitivity_analysis: "PlainConvRNN must match U1ConvRNN in all non-equivariance aspects."
    channels:
      value: 8
      status: FROZEN_ENGINEERING
      rationale: "Matched to U1 channel count for fair comparison."
      sensitivity_analysis: "See U1 channel sensitivity."
    height:
      value: 16
      status: FROZEN_ENGINEERING
      rationale: "Matched to U1."
      sensitivity_analysis: "See U1 height sensitivity."
    width:
      value: 16
      status: FROZEN_ENGINEERING
      rationale: "Matched to U1."
      sensitivity_analysis: "See U1 width sensitivity."
    kernel_size:
      value: 3
      status: FROZEN_ENGINEERING
      rationale: "Matched to U1."
      sensitivity_analysis: "See U1 kernel sensitivity."
    vocabulary:
      value: 10
      status: FROZEN_ENGINEERING
      rationale: "Matched to U1."
      sensitivity_analysis: "See U1 vocabulary sensitivity."

  # ── Factorial Baseline (2×2 Design) ──
  #
  # Factor A (linear map):
  #   Level 1: U(1)-commuting complex convolution (complex weights with cross-coupled real/imag)
  #   Level 2: unrestricted real convolution (independent real weights per channel)
  #
  # Factor B (nonlinearity):
  #   Level 1: radial activation (equivariant: preserves phase direction, radial_tanh)
  #   Level 2: elementwise activation (non-equivariant: tanh applied independently to real and imag)
  #
  # 2×2 Cell names:
  #   (A1,B1): "U1CommutingLinear_RadialNonlinear"    — full U(1)-equivariant (the U1ConvRNN itself)
  #   (A1,B2): "U1CommutingLinear_ElementwiseNonlinear" — isolates radial activation contribution
  #   (A2,B1): "RealLinear_RadialNonlinear"             — isolates U(1)-commuting linear contribution
  #   (A2,B2): "RealLinear_ElementwiseNonlinear"        — no equivariance (the PlainConvRNN itself)
  factorial_variants:
    status: UNFROZEN_CALIBRATION
    calibration_method: "C16 factorial baseline pilot"
    freeze_condition: "PI decision based on C14–C15 results"
    design:
      factor_a:
        name: "linear_map"
        level_1:
          label: "U1CommutingLinear"
          description: "Complex convolution with cross-coupled real/imaginary weights; commutes with U(1) phase rotation."
        level_2:
          label: "RealLinear"
          description: "Unrestricted real-valued convolution; no U(1) commutation constraint."
      factor_b:
        name: "nonlinearity"
        level_1:
          label: "RadialNonlinear"
          description: "Radial activation (radial_tanh): preserves angular direction; U(1)-equivariant."
        level_2:
          label: "ElementwiseNonlinear"
          description: "Elementwise tanh on real and imaginary parts independently; breaks U(1) equivariance."
      cells:
        - label: "U1CommutingLinear_RadialNonlinear"
          linear_map: "U1CommutingLinear"
          nonlinearity: "RadialNonlinear"
          role: "Full U(1)-equivariant baseline (the primary model)"
        - label: "U1CommutingLinear_ElementwiseNonlinear"
          linear_map: "U1CommutingLinear"
          nonlinearity: "ElementwiseNonlinear"
          role: "Isolates radial nonlinearity contribution"
        - label: "RealLinear_RadialNonlinear"
          linear_map: "RealLinear"
          nonlinearity: "RadialNonlinear"
          role: "Isolates U(1)-commuting linear contribution"
        - label: "RealLinear_ElementwiseNonlinear"
          linear_map: "RealLinear"
          nonlinearity: "ElementwiseNonlinear"
          role: "No equivariance (PlainConvRNN control)"

