# PM1-LEARNED-V2 CONTRACT
# Status: DRAFT (not frozen)
# Freeze condition: All UNFROZEN_CALIBRATION fields resolved via calibration + PI approval
# Any FROZEN_MATHEMATICAL or FROZEN_ENGINEERING value includes rationale and sensitivity_analysis.
# Any UNFROZEN_CALIBRATION value includes calibration_method and freeze_condition.

protocol: PM1-LEARNED-V2
scientific_version:
  value: "2.0.0-draft"
  status: UNFROZEN_CALIBRATION
  calibration_method: "PI approval of frozen contract"
  freeze_condition: "Contract fully frozen"

# ── Commit Separation ──
commits:
  design_base_commit:
    sha:
      value: "67b216bf05382c344425ea493119828412c5b3c5"
      status: FROZEN_ENGINEERING
      rationale: >
        The commit at which the codebase was inspected to ground this design.
        Identical to the README's documented "target commit" for PM1-LEARNED-V2
        planning.  Does NOT change after planning freeze.
      sensitivity_analysis: >
        If the base implementation differs materially from this commit (e.g.,
        git-tree divergence due to concurrent work), the contract must be
        re-baselined before calibration begins.
  planning_commit:
    sha:
      value: "34d0adb"
      status: FROZEN_ENGINEERING
      rationale: >
        The commit at which the PM1-LEARNED-V2 planning artifacts were
        authored.  Immutable after planning freeze.
      sensitivity_analysis: >
        If planning documents are corrected post-freeze, a new planning commit
        must be recorded and all downstream commits invalidated.
  implementation_commit:
    sha:
      status: UNFROZEN_CALIBRATION
      calibration_method: "Git tag at the point where all calibration gates (C01–C16) pass"
      freeze_condition: "All calibration experiments complete, code freeze declared, PI sign-off"
  analysis_commit:
    sha:
      status: UNFROZEN_CALIBRATION
      calibration_method: "Git tag after analysis scripts are frozen, before confirmatory execution"
      freeze_condition: "All analysis scripts written, tested on calibration data, and reviewed"
  diagnostic_commit:
    sha:
      status: UNFROZEN_CALIBRATION
      calibration_method: "Git tag of diagnostic tooling used during calibration"
      freeze_condition: "Diagnostic scripts stable; no further modification needed for confirmatory"

# ── Interpretation Boundary ──
interpretation_boundary:
  status: FROZEN_ENGINEERING
  rationale: "Firewall between V1 exploration and V2 evidence; non-negotiable for valid inference."
  sensitivity_analysis: "If V1 results are cited as motivation (not evidence), the boundary remains valid."
  text: >
    This contract governs the calibration and confirmatory phases of PM1-LEARNED-V2.
    V1 results are explicitly excluded from confirmatory evidence.
    V2 development-split results are excluded from all statistical tests.
    Calibration results may set thresholds but not serve as evidence for claims.

# ── Primary Scientific Question ──
primary_question: >
  Do U(1) vortex defects in the hidden state of a U(1)-equivariant ConvRNN
  causally control output behavior on a variable-delay copy task, with
  effects that are (a) stronger than every comparable null perturbation,
  (b) representative-invariant, (c) on the natural hidden-state manifold,
  and (d) absent from randomly-initialized (untrained) models?

primary_hypothesis: >
  Vortex transplant margin > max(all null family margins), with representative
  variance < charge variance, and manifold distance < natural variance pool 95p.

secondary_hypotheses:
  - id: cross_model_specificity
    text: "U1ConvRNN vortex margin > PlainConvRNN vortex margin (cross-model)"
  - id: per_family_superiority
    text: "Vortex effect surpasses each null family independently (IUT individual components)"
  - id: ood_generalization
    text: "Vortex effect persists at OOD delay=64"
  - id: training_vs_untrained
    text: >
      Trained-model vortex margin > untrained-model vortex margin (two-sided
      secondary: tests whether vortex causal effects are learned vs.
      architectural artifacts).  Rejection in the opposite direction
      (untrained ≥ trained) would constitute evidence against the learned
      mechanism claim.
  - id: charge_arrangement_superiority
    text: "Vortex margin > charge_arrangement_shuffle margin (charge is positional, not merely combinatorial)"

# ── Forbidden Claims ──
forbidden_claims:
  status: FROZEN_ENGINEERING
  rationale: "Prevent overclaiming; these boundaries are set by the causal identification framework."
  sensitivity_analysis: "Violating any forbidden claim invalidates the scientific claim, not just the statistics."
  claims:
    - "Vortices are the mechanism of copy task computation"
    - "Vortices are the only mechanism of copy task computation"
    - "Vortices are necessary for copy task computation" # unless T8 evidence
    - "Vortices are a general computational primitive in neural networks"
    - "Vortices are an innate (untrained) property of U(1)-equivariant models"

# ── Splits ──
development_split:
  namespace_prefix:
    value: "dev"
    status: FROZEN_ENGINEERING
    rationale: "Explicit namespace separation prevents accidental inclusion in statistical tests."
    sensitivity_analysis: "Repository hygiene (directory/commit separation) is the primary enforcement mechanism."
  allowed_actions:
    - "Iterative experimentation"
    - "Debugging"
    - "Threshold exploration"
  forbidden_actions:
    - "Use in any statistical test"
    - "Use as confirmatory evidence"
    - "Freeze parameters based on development results"

calibration_split:
  namespace_prefix:
    value: "cal"
    status: FROZEN_ENGINEERING
    rationale: "Explicit namespace separation for calibration experiments; mirrors V1 convention."
    sensitivity_analysis: >
      If calibration runs are reused as confirmatory (e.g., due to seed collision),
      the confirmatory Type-I error rate is inflated.  Hash-separated namespaces
      prevent this at the code level.
  seed_count:
    status: UNFROZEN_CALIBRATION
    candidate_values: [5, 10, 20]
    calibration_method: "Power analysis on C01–C04 diagnostics"
    freeze_condition: "PI approval after C01–C04 results"
  allowed_actions:
    - "Estimate variances (seed, within-seed, representative, null)"
    - "Tune decomposition/intervention hyperparameters"
    - "Select manifold model (PCA dim, kNN k)"
    - "Set statistical thresholds"
    - "Run all calibration experiments (C01–C16)"
  forbidden_actions:
    - "Use as confirmatory evidence"
    - "Report calibration effect sizes as primary results"
    - "Cherry-pick calibration runs"

confirmatory_split:
  namespace_prefix:
    value: "confirm"
    status: FROZEN_ENGINEERING
    rationale: "Fresh namespace guarantees no data leakage from calibration to confirmatory."
    sensitivity_analysis: "Seed prefix is embedded in hash-separated RNG; cross-prefix collision is cryptographically negligible."
  seed_count:
    status: UNFROZEN_CALIBRATION
    candidate_values: [20, 30, 50, 100]
    calibration_method: "Simulation-based power analysis using calibration variance estimates"
    freeze_condition: >
      Power ≥ 0.80 for the smallest effect size of scientific interest (SESOI).
      SESOI is defined as the minimum vortex-over-max-null advantage that would
      be considered scientifically meaningful, set by PI after reviewing
      calibration effect-size distributions.
  seed_generation_rule:
    value: "Hash-separated, incremental from 0, prefix 'confirm'"
    status: FROZEN_ENGINEERING
    rationale: "Deterministic seed generation for reproducibility."
    sensitivity_analysis: "Changing the hash key would change all seeds; the key must be recorded immutably."
  allowed_actions:
    - "Execute frozen contract"
    - "Report all results"
    - "Declare go/no-go"
  forbidden_actions:
    - "Modify thresholds after seeing results"
    - "Add/remove seeds after starting"
    - "Cherry-pick seeds"

